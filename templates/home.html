<!DOCTYPE html>
<html>
<head>
    <title>Family Memories</title>
</head>
<body>
    <h1>Family Memories</h1>

    <p>Every memory has a story. Every story deserves to be remembered.</p>

    <p><a href="/create-event">➕ Create New Event</a></p>

    <h2>Family Events</h2>

    <ul>
        {% for event in events %}
            <li>
                <a href="/event/{{ event['id'] }}">
                    <strong>{{ event["name"] }}</strong>
                </a><br>
                {{ event["year"] }} — {{ event["location"] }}
            </li>
        {% endfor %}
    </ul>
</body>
</html>
