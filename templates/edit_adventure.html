<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Adventure</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f5f0e8;
            color: #3d2b1f;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .nav {
            background: #3d2b1f;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav a {
            color: #f5f0e8;
            text-decoration: none;
            font-size: 18px;
        }
        .nav a:hover {
            color: #b8943c;
        }
        .form-box {
            background: #f5f0e8;
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #b8943c;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        .form-box h1 {
            color: #3d2b1f;
            text-align: center;
            font-size: 32px;
            margin: 0 0 10px 0;
        }
        .form-box .subtitle {
            color: #6b4c3a;
            text-align: center;
            font-size: 16px;
            margin-bottom: 30px;
        }
        label {
            display: block;
            color: #3d2b1f;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #b8943c;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: inherit;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
        }
        .btn-save {
            background: #2d5a27;
            color: white;
            padding: 14px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
        }
        .btn-save:hover {
            background: #1f3f1a;
        }
        .btn-cancel {
            background: #8b6b4a;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            display: inline-block;
            margin-top: 10px;
        }
        .btn-cancel:hover {
            background: #6b4c3a;
        }
        .btn-delete {
            background: #6b1a2e;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        .btn-delete:hover {
            background: #4a1220;
        }
        .action-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .required {
            color: #6b1a2e;
        }
    </style>
</head>
<body>

<!-- Navigation -->
<div class="nav">
    <div>
        <a href="/">🏠 Home</a>
        <span style="margin: 0 15px; color: #8b6b4a;">|</span>
        <a href="/event/{{ event.id }}" style="color: #f5f0e8;">{{ event.name }}</a>
        <span style="margin: 0 15px; color: #8b6b4a;">|</span>
        <span style="color: #b8943c;">✏️ Editing</span>
    </div>
</div>

<div class="container">

    <div class="form-box">
        <h1>✏️ Edit Adventure</h1>
        <p class="subtitle">Update the adventure details</p>

        <form method="POST" action="/edit-adventure-page/{{ event.id }}">

            <label>Adventure Name <span class="required">*</span></label>
            <input type="text" name="name" value="{{ event.name }}" required>

            <label>Year</label>
            <input type="text" name="year" value="{{ event.year or '' }}">

            <label>Month</label>
<select name="month" style="width: 100%; padding: 12px; border: 2px solid #b8943c; border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; font-family: inherit; font-size: 16px;">
    <option value="">-- Select Month --</option>
    <option value="January" {% if event.month == 'January' %}selected{% endif %}>January</option>
    <option value="February" {% if event.month == 'February' %}selected{% endif %}>February</option>
    <option value="March" {% if event.month == 'March' %}selected{% endif %}>March</option>
    <option value="April" {% if event.month == 'April' %}selected{% endif %}>April</option>
    <option value="May" {% if event.month == 'May' %}selected{% endif %}>May</option>
    <option value="June" {% if event.month == 'June' %}selected{% endif %}>June</option>
    <option value="July" {% if event.month == 'July' %}selected{% endif %}>July</option>
    <option value="August" {% if event.month == 'August' %}selected{% endif %}>August</option>
    <option value="September" {% if event.month == 'September' %}selected{% endif %}>September</option>
    <option value="October" {% if event.month == 'October' %}selected{% endif %}>October</option>
    <option value="November" {% if event.month == 'November' %}selected{% endif %}>November</option>
    <option value="December" {% if event.month == 'December' %}selected{% endif %}>December</option>
</select>

            <label>Location</label>
            <input type="text" name="location" value="{{ event.location or '' }}">

            <label>Description</label>
            <textarea name="description" rows="4">{{ event.description or '' }}</textarea>

            <div class="action-row">
                <button type="submit" class="btn-save">💾 Save Changes</button>
                <a href="/event/{{ event.id }}" class="btn-cancel">← Cancel</a>
                <button type="button" class="btn-delete" onclick="confirmDelete()">🗑️ Delete Adventure</button>
            </div>

        </form>
    </div>

</div>

<script>
    function confirmDelete() {
        if (confirm('⚠️ Are you sure you want to delete this adventure?\n\nThis will also delete all memories and photos associated with it.\n\nThis action cannot be undone!')) {
            window.location.href = "/delete-adventure-page/{{ event.id }}";
        }
    }
</script>

</body>
</html>
