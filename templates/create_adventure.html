<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Memories</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f5f0e8;
            color: #3d2b1f;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .form-box {
            background: #f5f0e8;
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #b8943c;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        .form-box h1 {
            color: #3d2b1f;
            text-align: center;
            font-size: 32px;
            margin: 0 0 10px 0;
        }
        .form-box p {
            color: #6b4c3a;
            text-align: center;
            font-size: 16px;
            margin-bottom: 30px;
        }
        label {
            display: block;
            color: #3d2b1f;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #b8943c;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: inherit;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
        }
        .btn-submit {
            background: #2d5a27;
            color: white;
            padding: 14px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
        }
        .btn-submit:hover {
            background: #1f3f1a;
        }
        .btn-cancel {
            background: #8b6b4a;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            display: inline-block;
            margin-top: 10px;
        }
        .nav {
            background: #3d2b1f;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav a {
            color: #f5f0e8;
            text-decoration: none;
            font-size: 18px;
        }
        .nav a:hover {
            color: #b8943c;
        }
    </style>
</head>
<body>

<!-- Navigation -->
<div class="nav">
    <div>
        <a href="/">🏠 Home</a>
        <span style="margin: 0 15px; color: #8b6b4a;">|</span>
        <span style="color: #b8943c;">📝 Create Adventure</span>
    </div>
</div>

<div class="container">

    <div class="form-box">
        <h1>📝 Create a New Adventure</h1>
        <p>Start a new adventure for your family to remember</p>

        <form method="POST">

            <label>Adventure Name <span style="color: #6b1a2e;">*</span></label>
            <input type="text" name="name" required placeholder="e.g., DeeDee and Papa Camp 2025">

            <label>Year</label>
            <input type="text" name="year" placeholder="e.g., 2025">

            <label>Month</label>
            <select name="month" style="width: 100%; padding: 12px; border: 2px solid #b8943c; border-radius: 8px; box-sizing: border-box; margin-bottom: 15px; font-family: inherit; font-size: 16px;">
                <option value="">-- Select Month --</option>
                <option value="January">January</option>
                <option value="February">February</option>
                <option value="March">March</option>
                <option value="April">April</option>
                <option value="May">May</option>
                <option value="June">June</option>
                <option value="July">July</option>
                <option value="August">August</option>
                <option value="September">September</option>
                <option value="October">October</option>
                <option value="November">November</option>
                <option value="December">December</option>
            </select>

            <label>Location</label>
            <input type="text" name="location" placeholder="e.g., Our House">

            <label>Description</label>
            <textarea name="description" rows="4" placeholder="Tell us about this adventure..."></textarea>

            <button type="submit" class="btn-submit">✨ Create Adventure</button>

        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="/" class="btn-cancel">← Back to Home</a>
        </div>
    </div>

</div>

</body>
</html>
