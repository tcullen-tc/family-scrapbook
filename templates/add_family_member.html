<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Family Member</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            background-color: #f5f0e8;
            color: #3d2b1f;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .nav {
            background: #3d2b1f;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav a {
            color: #f5f0e8;
            text-decoration: none;
            font-size: 18px;
        }
        .nav a:hover {
            color: #b8943c;
        }
        .form-box {
            background: #f5f0e8;
            padding: 40px;
            border-radius: 15px;
            border: 2px solid #b8943c;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }
        .form-box h1 {
            color: #3d2b1f;
            text-align: center;
            font-size: 32px;
            margin: 0 0 10px 0;
        }
        .form-box .subtitle {
            color: #6b4c3a;
            text-align: center;
            font-size: 16px;
            margin-bottom: 30px;
        }
        label {
            display: block;
            color: #3d2b1f;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #b8943c;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-family: inherit;
            font-size: 16px;
        }
        textarea {
            resize: vertical;
        }
        .btn-submit {
            background: #2d5a27;
            color: white;
            padding: 14px 40px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            width: 100%;
        }
        .btn-submit:hover {
            background: #1f3f1a;
        }
        .btn-cancel {
            background: #8b6b4a;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 10px;
            font-size: 16px;
            display: inline-block;
            margin-top: 10px;
        }
        .btn-cancel:hover {
            background: #6b4c3a;
        }
        .file-hint {
            color: #6b4c3a;
            font-size: 12px;
            margin-top: -10px;
            margin-bottom: 15px;
        }
        .required {
            color: #6b1a2e;
        }
    </style>
</head>
<body>

<!-- Navigation -->
<div class="nav">
    <div>
        <a href="/">🏠 Home</a>
        <span style="margin: 0 15px; color: #8b6b4a;">|</span>
        <a href="/family-members">👨‍👩‍👧‍👦 Family</a>
        <span style="margin: 0 15px; color: #8b6b4a;">|</span>
        <span style="color: #b8943c;">➕ Add Family Member</span>
    </div>
</div>

<div class="container">

    <div class="form-box">
        <h1>👨‍👩‍👧‍👦 Add Family Member</h1>
        <p class="subtitle">Add someone to your family tree</p>

        <form method="POST" action="/add-family-member" enctype="multipart/form-data">

            <label>Full Name <span class="required">*</span></label>
            <input type="text" name="name" required placeholder="e.g., Papa Rick">

            <label>Email Address</label>
            <input type="email" name="email" placeholder="e.g., family@example.com">
            <p class="file-hint">Optional. Used for notifications when new memories are added.</p>

            <label>Nickname</label>
            <input type="text" name="nickname" placeholder="e.g., Papa">

            <label>Birth Date</label>
            <input type="date" name="birth_date">

            <label>Profile Photo</label>
            <input type="file" name="photo" accept="image/*">
            <p class="file-hint">Optional. Upload a photo of this family member.</p>

            <label>Bio / About</label>
            <textarea name="bio" rows="4" placeholder="Tell us about this family member..."></textarea>

            <button type="submit" class="btn-submit">👨‍👩‍👧‍👦 Add Family Member</button>

        </form>

        <div style="text-align: center; margin-top: 15px;">
            <a href="/family-members" class="btn-cancel">← Back to Family</a>
        </div>
    </div>

</div>

</body>
</html>
